<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Banner</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    background:#111;
}

.banner{

    width:1584px;
    height: 500px;
    background:linear-gradient(130deg,#0b0b0b,#151515,#1d1d1d);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:space-between;
    padding:40px 60px;
    border:2px solid rgba(255,0,0,.3);
    box-shadow:0 0 40px rgba(255,0,0,.25);

}

/* Glow */

.circle{

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

}

.one{

    width:280px;
    height:280px;
    background:red;

    top:-90px;
    left:-100px;

}

.two{

    width:220px;
    height:220px;
    background:#ff3b3b;

    bottom:-80px;
    right:-80px;

}

.left{

    width:60%;
    z-index:10;

}

.left h1{

    font-size:56px;
    color:white;
    letter-spacing:3px;

    text-shadow:0 0 20px red;

}

.left h2{

    margin-top:12px;

    color:#ff4040;

    font-size:25px;

    letter-spacing:4px;

}

.left p{

    color:#d5d5d5;

    margin-top:20px;

    width:85%;

    line-height:30px;

    font-size:18px;

}

.skills{

    display:flex;

    flex-wrap:wrap;

    gap:14px;

    margin-top:30px;

}

.skills span{

    padding:10px 22px;

    border:1px solid red;

    color:white;

    border-radius:30px;

    background:rgba(255,0,0,.12);

    transition:.3s;

}

.skills span:hover{

    background:red;

    transform:translateY(-5px);

}

.right{

    width:32%;

    display:flex;

    flex-direction:column;

    gap:18px;

    z-index:10;

}

.card{

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.12);

    border-radius:18px;

    padding:18px;

}

.card h3{

    color:white;

    margin-bottom:18px;

    font-size:22px;

}

.icons{

    display:flex;

    gap:25px;

    font-size:38px;

    color:#ff3b3b;

}

.tool-list{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}

.tool-list span{

    color:white;

    border:1px solid rgba(255,0,0,.5);

    padding:8px 15px;

    border-radius:20px;

}

.banner::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:20px;

    padding:2px;

    background:linear-gradient(90deg,
    transparent,
    red,
    transparent);

    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    animation:borderMove 5s linear infinite;

}

@keyframes borderMove{

    from{

        background-position:0%;

    }

    to{

        background-position:300%;

    }

}
</style>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="banner">

    <!-- Glow -->
    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="left">

        <h1>SANCHIT JADHAV</h1>

        <h2>JAVA FULL STACK DEVELOPER</h2>

        <p>
            Passionate about building web applications,
            learning backend technologies,
            and creating immersive game worlds.
        </p>

        <div class="skills">

            <span>Java</span>
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>SQL</span>
            <span>MongoDB</span>
            <span>Node.js</span>
            <span>Git</span>
            <span>GitHub</span>
            <span>OOP</span>
            <span>DSA</span>

        </div>

    </div>

    <div class="right">

        <div class="card">

            <h3>Frontend</h3>

            <div class="icons">
                <i class="fa-brands fa-html5"></i>
                <i class="fa-brands fa-css3-alt"></i>
                <i class="fa-brands fa-js"></i>
            </div>

        </div>

        <div class="card">

            <h3>Backend</h3>

            <div class="icons">
                <i class="fa-brands fa-java"></i>
                <i class="fa-solid fa-database"></i>
                <i class="fa-brands fa-node-js"></i>
            </div>

        </div>

        <div class="card">

            <h3>Tools</h3>

            <div class="tool-list">

                <span>VS Code</span>
                <span>GitHub</span>
                <span>Blender</span>
                <span>Unreal Engine</span>
                <span>DaVinci Resolve</span>

            </div>

        </div>

    </div>

</div>

</body>
</html>
